<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d13" />
    <meta name="description" content="Bedrock Studio — a visual Minecraft Bedrock Add-On editor for the web." />
    <title>Bedrock Studio</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #090d13; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #bedrock-boot { min-height: 100vh; display: grid; place-items: center; padding: 28px; box-sizing: border-box; }
      #bedrock-boot-card { width: min(520px, 100%); border: 1px solid #26313e; border-radius: 18px; padding: 24px; background: #0f151d; box-sizing: border-box; box-shadow: 0 20px 70px rgba(0,0,0,.25); }
      #bedrock-boot-card strong { display: block; font-size: 22px; margin-bottom: 8px; color: #f9fafb; }
      #bedrock-boot-card p { margin: 0; color: #94a3b8; line-height: 1.55; }
      #bedrock-boot-error { margin-top: 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: #fca5a5; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="bedrock-boot">
        <div id="bedrock-boot-card">
          <strong>Bedrock Studio</strong>
          <p>Loading Experimental 0.1…</p>
          <div id="bedrock-boot-error"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        function showBootError(message) {
          var boot = document.getElementById('bedrock-boot');
          var text = document.getElementById('bedrock-boot-error');
          if (!boot || !text) return;
          text.textContent = 'Startup error: ' + message;
        }

        window.addEventListener('error', function (event) {
          showBootError(event.message || 'Unknown JavaScript error.');
        });

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showBootError(reason && reason.message ? reason.message : String(reason || 'Unhandled promise rejection.'));
        });

        window.setTimeout(function () {
          if (document.getElementById('bedrock-boot')) {
            showBootError('The application did not start. Reload this page. If this message remains, send me the exact text shown here.');
          }
        }, 7000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
